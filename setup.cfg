[metadata]
name = atb_api
version = 0.1
author = Martin Stroet, Bertrand Caron
author_email = m.stroet@uq.edu.au
classifiers =
    Environment :: Console
    Framework :: Setuptools Plugin
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
license = GPLv3
license_files = LICENSE
description = API for the ATB webservice
long_description = file: README.md

[options]
package_dir=
    =src
packages=find:
install_requires =
    importlib-metadata; python_version<"3.8"
    pyyaml>=6.0
    # atb_api.atb_api imports this at module level, so it is a hard dependency,
    # not an optional one. It was missing here: hosts that already happened to
    # have requests installed masked the gap, and a clean install (a fresh HPC
    # venv) failed at import with ModuleNotFoundError.
    requests

[options.packages.find]
where=src
